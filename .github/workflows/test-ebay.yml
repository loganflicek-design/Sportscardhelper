name: Test eBay connectivity

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: Run comp lookup via real CLI
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          EBAY_DEV_ID: ${{ secrets.EBAY_DEV_ID }}
          EBAY_ENV: PRODUCTION
        run: |
          echo "=== App ID prefix: ${EBAY_APP_ID:0:12}... ==="
          echo "=== Cert ID prefix: ${EBAY_CERT_ID:0:12}... ==="
          echo ""
          echo "=== Comp lookup test ==="
          npx tsx cli/index.ts comp "2018 Donruss Optic Luka Doncic Rated Rookie PSA 10"
          echo ""
          echo "✅ DONE"
